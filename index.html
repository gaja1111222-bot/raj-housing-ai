function extractBHK(text) {
    let match = text.match(/\b([1-4])\s*bhk\b/i);
    return match ? parseInt(match[1]) : null;
}

function extractLocation(text) {

    const locations = [
        "Mapusa",
        "Ponda",
        "Sadar",
        "Panjim",
        "Ribandar",
        "Dabolim",
        "Vasco",
        "Siolim",
        "Mardol",
        "Mangeshi",
        "Dhawali",
        "Karaswada",
        "Shantinagar",
        "Portvaddo",
        "Dag",
        "Upper Bazar",
        "Upper Bazaar"
    ];

    const lower = text.toLowerCase();

    for (const location of locations) {
        if (lower.includes(location.toLowerCase())) {
            return location;
        }
    }

    return null;
}

function findProperties() {

    const text = document.getElementById("requirement").value.trim();
    const resultsBox = document.getElementById("results");

    if (!text) {
        resultsBox.innerHTML =
        "<div class='card'>⚠️ Please enter your property requirement.</div>";
        return;
    }

    const bhk = extractBHK(text);
    const location = extractLocation(text);

    let results = [];

    properties.forEach(row => {

        let score = 0;
        let reasons = [];

        const project = row["Project Name"] || "";
        const status = row["Status"] || "";
        const category = row["Property Category"] || "";
        const typology = row["Typology"] || "";
        const propertyLocation = row["Location"] || "";
        const bhkType = row["BHK / Unit Type"] || "";
        const price = row["Price"] || "";

        const combined =
            (category + " " +
             typology + " " +
             propertyLocation + " " +
             bhkType).toLowerCase();

        if (bhk !== null) {

            if (
                combined.includes(bhk + " bhk") ||
                (bhk === 2 && (
                    combined.includes("2 & 3") ||
                    combined.includes("2/3")
                ))
            ) {
                score += 40;
                reasons.push("✓ BHK requirement matches");
            }
        }

        if (
            location &&
            combined.includes(location.toLowerCase())
        ) {
            score += 30;
            reasons.push("✓ Location matches");
        }

        if (
            /flat|apartment|residential/i.test(text) &&
            /flat|apartment|residential/i.test(combined)
        ) {
            score += 15;
            reasons.push("✓ Residential property matches");
        }

        if (
            text.toLowerCase().includes("ongoing") &&
            status.toLowerCase().includes("ongoing")
        ) {
            score += 15;
            reasons.push("✓ Ongoing project matches");
        }

        if (score > 0) {
            results.push({
                score,
                project,
                status,
                category,
                typology,
                propertyLocation,
                bhkType,
                price,
                reasons
            });
        }
    });

    results.sort((a,b) => b.score - a.score);

    if (results.length === 0) {

        resultsBox.innerHTML = `
        <div class="card">
        <h2>🔎 No strong match found</h2>
        <p>We could not find a strong match in the verified Raj Housing database.</p>
        <p>Please try another location, BHK, or requirement.</p>
        <p><b>Important:</b> We only show information verified from Raj Housing.</p>
        </div>
        `;

        return;
    }

    let output =
    "<h2 style='margin-top:25px;'>🏠 Recommended Properties</h2>";

    results.slice(0,5).forEach(result => {

        const priceText =
            result.price.trim() === ""
            ? "💰 Price: Not published"
            : "💰 Price: " + result.price;

        output += `
        <div class="card">

        <h2>🏠 ${result.project}</h2>

        <div class="score">
        Match Score: ${result.score}%
        </div>

        <div class="info">

        📍 <b>Location:</b> ${result.propertyLocation}<br>

        🏢 <b>Property Type:</b> ${result.category}<br>

        🛏️ <b>BHK / Unit Type:</b> ${result.bhkType}<br>

        📌 <b>Status:</b> ${result.status}<br>

        ${priceText}

        </div>

        <p><b>Why this matches:</b></p>

        <p>
        ${result.reasons.length
            ? result.reasons.join("<br>")
            : "Verified project information available."
        }
        </p>

        <p>
        📞 <b>Contact Raj Housing:</b>
        9763719962 / 9011044394
        </p>

        </div>
        `;
    });

    output += `
    <div class="warning">

    <b>🔒 Information Accuracy</b><br><br>

    Property information is shown only from the verified
    Raj Housing database.

    If price, area, RERA number or availability is not
    officially published, it will not be guessed.

    </div>
    `;

    resultsBox.innerHTML = output;
}
